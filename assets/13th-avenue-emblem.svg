<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#F3E5AB"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Outfit:wght@500;600&amp;display=swap');
      .crest-num {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 140px;
        font-weight: 700;
        fill: url(#crestGold);
        text-anchor: middle;
      }
      .crest-letter {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 110px;
        font-weight: 600;
        font-style: italic;
        fill: url(#crestGold);
        text-anchor: middle;
      }
      .crest-sub {
        font-family: 'Outfit', sans-serif;
        font-size: 13px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        fill: #0f0f10;
        text-anchor: middle;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Outer Luxury Rings -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#crestGold)" stroke-width="2.5" />
  <circle cx="250" cy="220" r="152" fill="none" stroke="url(#crestGold)" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Monogram 13 + Avenue Monogram Motif -->
  <text x="215" y="245" class="crest-num">13</text>
  <text x="290" y="245" class="crest-letter">A</text>

  <!-- Star Embellishment -->
  <path d="M 250 85 L 253 95 L 263 98 L 253 101 L 250 111 L 247 101 L 237 98 L 247 95 Z" fill="url(#crestGold)" />

  <!-- Lower Branding -->
  <text x="250" y="420" class="crest-sub">13TH AVENUE</text>
  <text x="250" y="445" style="font-family:'Outfit', sans-serif; font-size:10px; letter-spacing:0.25em; fill:#71717a; text-anchor:middle;">DUBAI • PARIS • LONDON</text>
</svg>
